---
layout: default
---
<article class="wrap prose">
  <header class="page-head">
    <p class="eyebrow"><a href="{{ '/news/' | relative_url }}">News</a></p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      {% if page.tag %}<span class="tag">{{ page.tag }}</span>{% endif %}
    </p>
  </header>

  {{ content }}

  <hr>
  <p><a href="{{ '/news/' | relative_url }}">&larr; All news</a></p>
</article>
