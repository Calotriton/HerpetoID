[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "herpetoid"
version = "0.1.0"
description = "Modular platform for non-invasive individual identification of wildlife from natural body patterns."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "HerpetoID contributors" }]
keywords = [
    "wildlife",
    "photo-identification",
    "mark-recapture",
    "computer-vision",
    "herpetology",
    "biodiversity",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Base runtime dependencies. NOTE: the Qt-free core (domain / application / infrastructure) and the
# plugin SDK (`herpetoid.api`) never import PySide6 — the GUI is an isolated layer. PySide6 is still a
# base dependency because HerpetoID ships as a desktop application.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "opencv-python-headless>=4.9",  # headless: avoids bundling a second Qt that clashes with PySide6
    "Pillow>=10.0",                 # image IO, EXIF, thumbnails
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "platformdirs>=4.0",            # per-OS app-data / config / cache locations
    "openpyxl>=3.1",                # Excel (.xlsx) export
    "reportlab>=4.0",               # PDF report / dossier export
    "matplotlib>=3.8",              # statistics charts (dashboards + PDF)
    "PySide6>=6.6",                 # desktop GUI (isolated in herpetoid.gui)
]

[project.optional-dependencies]
# Optional deep-learning algorithm plugins (SuperPoint / DINOv2 / CNN embeddings). Kept out of the
# base install so the app stays light and GPU-optional.
dl = ["torch>=2.2", "torchvision>=0.17"]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyinstaller>=6.0",
]

[project.scripts]
herpetoid = "herpetoid.__main__:main"

# First-party plugins, discovered by the registry via these entry-point groups.
[project.entry-points."herpetoid.algorithms"]
orb = "herpetoid.plugins.algorithms.orb:OrbAlgorithm"

[project.entry-points."herpetoid.species_modules"]
calotriton_asper = "herpetoid.plugins.species.calotriton_asper:CalotritonAsperModule"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"herpetoid" = ["resources/**/*", "py.typed"]

# ----------------------------------------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",  # long strings/docstrings tolerated; formatter handles code width
    "B027",  # empty methods in ABCs are intentional optional hooks (initialize)
]

[tool.ruff.lint.isort]
known-first-party = ["herpetoid"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["herpetoid"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["cv2.*", "skimage.*", "scipy.*", "reportlab.*", "openpyxl.*", "matplotlib.*"]
ignore_missing_imports = true

# The Qt-free core stays fully strict; the GUI glue layer relaxes the checks that fight Qt's stubs.
[[tool.mypy.overrides]]
module = "herpetoid.gui.*"
warn_return_any = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gui: tests that require a Qt environment (pytest-qt, offscreen)",
    "integration: integration tests spanning multiple layers",
]

[tool.coverage.run]
source = ["herpetoid"]
branch = true

[tool.coverage.report]
show_missing = true
